name: security-copilot

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seccopilot
      POSTGRES_PASSWORD: seccopilot
      POSTGRES_DB: seccopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seccopilot -d seccopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI backend ───────────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: ../../infra/docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://seccopilot:seccopilot@postgres:5432/seccopilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: DEBUG
    volumes:
      # Hot-reload in dev: mount source over the image copy
      - ./services/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Next.js dashboard ─────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: ./infra/docker/web.Dockerfile
      target: builder   # dev: use builder stage (has dev deps)
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: pnpm --filter @security-copilot/web dev
    depends_on:
      api:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
